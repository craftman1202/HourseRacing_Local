apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/ingress-status: all
    run.googleapis.com/maxScale: '40'
    run.googleapis.com/urls: '["https://nar-api-110558416539.asia-northeast1.run.app","https://nar-api-bwl3vrgzdq-an.a.run.app"]'
  labels:
    cloud.googleapis.com/location: asia-northeast1
  name: nar-api
  namespace: '110558416539'
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: '5'
        run.googleapis.com/client-name: gcloud
        run.googleapis.com/client-version: 572.0.0
        run.googleapis.com/cpu-throttling: 'true'
        run.googleapis.com/startup-cpu-boost: 'true'
      labels:
        client.knative.dev/nonce: dkjbeiguli
        run.googleapis.com/startupProbeType: Default
    spec:
      containerConcurrency: 1
      containers:
      - env:
        - name: NAROPS_BACKEND
          value: bigquery
        - name: NAROPS_MODEL_BUCKET
          value: nar-model-sample-335613
        - name: NAROPS_MODE
          value: paper
        - name: MODEL_PROVENANCE
          value: real
        image: asia-northeast1-docker.pkg.dev/sample-335613/nar-api/nar-api:v2026.08.29-web1
        ports:
        - containerPort: 8080
          name: http1
        resources:
          limits:
            cpu: '0.5'
            memory: 512Mi
        startupProbe:
          failureThreshold: 1
          periodSeconds: 240
          tcpSocket:
            port: 8080
          timeoutSeconds: 240
      serviceAccountName: nar-api@sample-335613.iam.gserviceaccount.com
      timeoutSeconds: 300
  traffic:
  - latestRevision: true
    percent: 100
