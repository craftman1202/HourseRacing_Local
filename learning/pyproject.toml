[project]
name = "nar-ml"
version = "0.1.0"
description = "地方競馬 予測モデル（ローカル開発）"
requires-python = ">=3.12"
dependencies = [
  "pandas>=2.2",
  "numpy>=2.0",
  "scipy>=1.14",
  "pyarrow>=17",
  "duckdb>=1.1",
  "fsspec>=2024.6",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "lightgbm>=4.5",
  "scikit-learn>=1.5",
  "matplotlib>=3.9",
  "seaborn>=0.13",
]

[project.optional-dependencies]
gcs = ["gcsfs>=2024.6"]
bayes = ["numpyro>=0.15", "jax>=0.4"]
hpo = ["optuna>=4.0", "mlflow>=2.16"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]
notebook = ["nbformat>=5.10", "nbclient>=0.10", "ipykernel>=6.29"]

[project.scripts]
nar = "nar.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "slow: nightly 実行（モデル正当性・全期間リーク検証）",
  "network: ネットワーク依存。全体の5%以下に抑える",
]
