# 買い目の規則（方針）。リリース（モデルの配布物）の payout_meta.json より優先する。
# 2026-10-20 ユーザー指示: 券種ごとに「実現確率の足切りを設け、ブートストラップ CI の中央値が 1 以上、
# かつ CI 下限が最も高い」戦略を採用する。グリッド: EV の下限 1.0〜10.0（0.1 刻み）× 的中確率の足切り 0〜60%（1% 刻み）、
# 無オッズ系の軸の確率 0〜80%（1% 刻み）。選択は 2020〜2023 の検証期間のみ（開催日単位のブロックブートストラップ）。
# 条件を満たす戦略が無い券種（枠連）は採用なし＝買い目を出さない。
# 再現: learning/scripts/strategy_ci_select.py → strategy_ci_oos.py（結果は learning/artifacts/ci_select/）。
# p_min = 的中確率（組の p_ens）の足切り。mode: all = EV 条件を満たす全部 / top1 = レースで EV 最大の1点。
# 注意: 候補が多いほど「CI 下限が最大」の選択は検証期間に過適合する。OOS（2024-02〜）では 3連複 0.88・3連単 0.84・
# 枠単 0.77 など 1 を下回る券種がある（note に併記）。
