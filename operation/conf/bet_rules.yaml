- bet: wide
  t: 2.0
  p_min: 0.0
  mode: top1
  note: 2020-23 ROI 1.01 CI[0.81,1.23] / OOS 0.96 [0.69,1.25]
- bet: trio
  t: 2.0
  p_min: 0.0
  mode: top1
  note: 2020-23 ROI 1.16 CI[1.01,1.34] / OOS 0.82 [0.71,0.93]
- bet: trifecta
