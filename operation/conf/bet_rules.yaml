# 買い目の規則（方針）。リリース（モデルの配布物）の payout_meta.json より優先する。
# 2026-10-20 ユーザー指示: 券種ごとに「実現確率の足切りを設け、ブートストラップ CI の中央値が 1 以上、
# かつ CI 下限が最も高い」戦略を採用する。選択は 2020〜2023 の検証期間のみ（開催日単位のブロックブートストラップ）。
# 条件を満たす戦略が無い券種（複勝、枠連）は採用なし＝買い目を出さない。
# 再現: learning/scripts/strategy_ci_select.py → strategy_ci_oos.py（結果は learning/artifacts/ci_select/）。
# p_min = 的中確率（組の p_ens）の足切り。mode: all = EV 条件を満たす全部 / top1 = レースで EV 最大の1点。
# 注意: OOS（2024-02〜）の確認では単勝 0.94・3連複 0.82・枠単 0.78 など、1 を下回る券種が多い（note に併記）。
ev_rules:
- bet: win
  t: 1.5
  p_min: 0.05
  mode: all
  note: 2020-23 ROI 1.13 CI[1.03,1.24] / OOS 0.94 [0.81,1.07]
- bet: quinella
  t: 2.0
  p_min: 0.0
  mode: all
  note: 2020-23 ROI 1.16 CI[0.96,1.37] / OOS 1.09 [0.82,1.42]
- bet: exacta
