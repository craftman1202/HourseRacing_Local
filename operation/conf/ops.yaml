# 運用設定
# 上限値はコードに埋め込まず、必ずここか環境変数で管理する（設計書 §3.3）

gcp:
  project: sample-335613
  region: asia-northeast1        # CO-02
  max_bytes_billed: 2000000000   # 2GB。未設定のクエリは実行させない（CO-01）

  # このプロジェクトは共用。既存ワークロード（chx-*, jra-*, hourse-racing-webui,
  # finml-*）と衝突しないよう、本システムの資源はすべて nar_ops / nar-ops- で
  # 名前空間を切る。既存の `hourse_racing` データセットと
  # `hourse-racing-inference-sample-335613` バケットは**別システムの資産**であり、
  # 本システムからは読み書きしない。
  resources:
    bq_dataset: nar_ops
    gcs_raw: nar-raw-sample-335613
    gcs_model: nar-model-sample-335613
    tasks_queue: nar-queue
    services:
      ops: nar-ops
      api: nar-api
      web: nar-web
    scheduler_prefix: nar-

inference:
  # 発走10分前に置く根拠（2026-09-21、13分から短縮）: オッズは締切近くほど
  # 情報量が大きい／Discord を見て投票を入力する時間に最低5分／推論失敗時の
  # リトライ分の余裕。
  #
  # retry_backoff_sec の合計（260秒 ≒ 4.3分）は「最低5分」の枠を必ず残す
  # よう 10 分から逆算した上限（300秒）以内に収めている。旧 [30, 90, 270]
  # （13分前提、合計390秒）のままリード時間だけ10分に縮めると、3回すべて
  # リトライした場合に最低5分の枠を割り込む（10分 - 6.5分 = 3.5分）ため、
  # 縮めた（jobs.RetryPolicy の既定値もこれに合わせている）。
  lead_minutes: 10
  lead_tolerance_sec: 60         # IN-03
  retry_backoff_sec: [20, 60, 180]
  max_retries: 3

update:
  live_refresh_hours_jst: [12, 16, 20]   # DB-05/06
  odds_snapshot_interval_min: 10          # 通常帯
  odds_snapshot_close_interval_min: 5     # 発走15分前〜発走
  final_merge_hour_jst: 2
  final_merge_minute_jst: 40
  skew_check_hour_jst: 3
  skew_check_minute_jst: 30

discord:
  min_ev: 1.05                   # これ未満は通知しない（DC-06）
  rate_limit_rps: 0.4            # 30 req/min に対する安全マージン
  max_embeds_per_message: 10     # DC-03
  max_chars_per_message: 5500    # 6000 に余裕を持たせる
  ev_color_green: 1.20
  ev_color_yellow: 1.05

betting:
  kelly_fraction: 0.25           # 1/4 Kelly。段階計画では 0.1 から始める
  max_per_race: 3000
  max_per_day: 50000             # 2026-09-28 10000→50000（EV の高い方を1点の導入に合わせて。バックテストの日次最大 ¥41,100）

# 単勝・複勝の EV の高い方を1点（2026-09-27）。複勝モデル（place_meta.json）を持つ
# リリースの平地だけに効く。ばんえい・旧リリースは上の betting（単勝のみ・1/4 Kelly・
# 自己インパクト補正あり）のまま。
# 閾値は 2026-02〜05 のオッズ付き OOS で選び、06〜09 で1回測った値
# （learning/scripts/deployed_rule_backtest.py: dev ROI 0.89 / test ROI 1.07
#  [95%CI 0.95, 1.20]）。オッズは確定値で測っているので実運用より楽観側。
# 自己インパクト補正はしていない（10分前オッズで判定し、自分の投票でオッズが下がる分は未反映）。
strategy:
  name: max_ev
  min_ev: 1.0                    # 選んだ券種の EV がこれ以上
  min_prob: 0.6                  # 選んだ券種の的中確率がこれ以上（単勝なら p_win、複勝なら p_place）
  kelly_scale: 1.0               # フルケリー
  budget_win_per_race: 10000     # 単勝の1レース予算（Σケリー比率 ≤ 1）
  budget_place_per_race: 10000   # 複勝の1レース予算
  place_odds_alpha: 0.257        # 複勝の想定払戻 = 下限 + α(上限 − 下限)。実払戻の平均位置

skew:
  # 日内更新に起因する差分が許容される列。これ以外の乖離は即 Blocker（SK-03）
  tolerated_columns:
    - j_wins_today
    - t_wins_today
    - track_speed_bias

monitoring:
  model_stale_days: 90           # current の学習日がこれ以上前なら鮮度アラート
  ece_degradation: 0.02          # OOS 比でこれ以上悪化したらアラート
  psi_threshold: 0.25
  coverage_min: 0.90
  rf_top1_max: 0.60              # RF-01
  rf_nll_min: 1.20               # RF-02
  rf_roi_max: 1.30               # RF-03
  rf_roi_months: 3

slo:
  notify_before_minutes: 10      # SC-07
  notify_ratio: 0.95
  coverage_ratio: 0.98           # SC-06
  db_fresh_by_hour_jst: 4
