# 自動発注の設定（PC 上のランナー narops.orders.runner が読む）。クラウドは読まない。
#
# 実発注にするには、ここで live: true にし、さらに環境変数 NAR_ORDERS_LIVE=1 でランナーを起動する。
# どちらかが欠ければドライランになる。
# 金額は仮の既定値。楽天側にも購入限度額（アカウント設定）があり、超える注文は楽天に拒否される。
live: false

bet_types: [単勝, 複勝, 馬連, ワイド]   # 実運用の券種（2026-10-20 ユーザー指示）
line_cap_yen: 1200           # 1券種（1行）の上限。超えたら点数を削らず見送る
race_cap_yen: 2000           # 1レースの上限（2026-10-18 ユーザー指示で 1500 → 2000）
daily_loss_cap_yen: 3000    # 1日の損失の上限（賭け額ではなく損失。損失 = その日の基準残高 − 今の精算可能額。2026-10-19 ユーザー指示）

open_min_before: 10          # 発走の何分前から発注するか（推論は 13 分前に出る）
close_min_before: 3          # 発走の何分前までに終えるか（楽天の投票締切は発走の 2 分前）
max_consecutive_errors: 3    # 連続エラーでランナーが止まる回数
