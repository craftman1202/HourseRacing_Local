# 自動発注の設定（PC 上のランナー narops.orders.runner が読む）。クラウドは読まない。
#
# 実発注にするには、ここで live: true にし、さらに環境変数 NAR_ORDERS_LIVE=1 でランナーを起動する。
# どちらかが欠ければドライランになる。以下の金額・券種は仮の既定値で、**ユーザーが決めるもの**。
live: false

bet_types: [単勝, 複勝]       # 発注を許す券種。ここに無い券種は計画があっても見送る
line_cap_yen: 500            # 1券種（1行）の上限。超えたら点数を削らず見送る
race_cap_yen: 1000           # 1レースの上限
daily_cap_yen: 3000          # 1日の発注合計の上限

open_min_before: 10          # 発走の何分前から発注するか（推論は 13 分前に出る）
close_min_before: 3          # 発走の何分前までに終えるか（NAR の締切は発走の少し前）
max_consecutive_errors: 3    # 連続エラーでランナーが止まる回数
